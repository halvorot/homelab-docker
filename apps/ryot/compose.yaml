services:
  ryot-db:
    image: postgres:18-alpine
    container_name: ryot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${RYOT_POSTGRES_USER:-ryot}
      POSTGRES_PASSWORD: ${RYOT_POSTGRES_PASSWORD:?RYOT_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${RYOT_POSTGRES_DB:-ryot}
    volumes:
      - /srv/data/ryot/postgres:/var/lib/postgresql
    networks:
      - homelab-docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RYOT_POSTGRES_USER:-ryot} -d ${RYOT_POSTGRES_DB:-ryot}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  ryot:
    image: ignisda/ryot:v10
    container_name: ryot
    restart: unless-stopped
    environment:
      TZ: Europe/Oslo
      FRONTEND_URL: https://ryot.halvorteigen.no
      DATABASE_URL: postgres://${RYOT_POSTGRES_USER:-ryot}:${RYOT_POSTGRES_PASSWORD:?RYOT_POSTGRES_PASSWORD is required}@ryot-db:5432/${RYOT_POSTGRES_DB:-ryot}
      SERVER_ADMIN_ACCESS_TOKEN: ${RYOT_SERVER_ADMIN_ACCESS_TOKEN:?RYOT_SERVER_ADMIN_ACCESS_TOKEN is required}
      DISABLE_TELEMETRY: "true"
    networks:
      - homelab-docker
    depends_on:
      ryot-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  homelab-docker:
    name: homelab-docker
    external: true
