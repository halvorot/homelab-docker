services:
  postgres:
    container_name: n8n-postgres
    image: postgres:18
    restart: always
    environment:
      - POSTGRES_USER=${N8N_POSTGRES_USER}
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - POSTGRES_DB=${N8N_POSTGRES_DB}
      - POSTGRES_NON_ROOT_USER=${N8N_POSTGRES_NON_ROOT_USER}
      - POSTGRES_NON_ROOT_PASSWORD=${N8N_POSTGRES_NON_ROOT_PASSWORD}
    volumes:
      - /srv/data/n8n/postgres:/var/lib/postgresql
      - ./apps/n8n/init-data.sh:/docker-entrypoint-initdb.d/init-data.sh
    networks:
      - homelab-docker
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${N8N_POSTGRES_USER} -d ${N8N_POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    container_name: n8n
    image: docker.n8n.io/n8nio/n8n:2.32.3
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_POSTGRES_DB}
      - DB_POSTGRESDB_USER=${N8N_POSTGRES_NON_ROOT_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_NON_ROOT_PASSWORD}
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - GENERIC_TIMEZONE="Europe/Oslo"
      - N8N_HOST=n8n.halvorteigen.no
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://n8n.halvorteigen.no
      - WEBHOOK_URL=https://n8n.halvorteigen.no/
      - N8N_PROXY_HOPS=2
      - N8N_ENABLED_MODULES=agents,instance-ai
      - N8N_INSTANCE_AI_MODEL=gpt-5.6-luna
      - N8N_INSTANCE_AI_SANDBOX_ENABLED='true'
      - N8N_INSTANCE_AI_SANDBOX_IMAGE=ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.1.1
      - N8N_INSTANCE_AI_SANDBOX_API_URL=http://n8n-sandbox-api:8080
    volumes:
      - /srv/data/n8n/n8n:/home/node/.n8n
    networks:
      - homelab-docker
    healthcheck:
      test:
        - CMD-SHELL
        - wget --spider http://localhost:5678/healthz > /dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      sandbox-api:
        condition: service_healthy

  n8n-runner:
    container_name: n8n-runner
    image: n8nio/runners:2.35.3
    restart: always
    environment:
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN}
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
    networks:
      - homelab-docker
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          const socket = require('node:net').connect(5679, 'n8n'); socket.on('connect',
          () => { socket.end(); process.exit(0); }); socket.on('error', () =>
          process.exit(1));
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    depends_on:
      n8n:
        condition: service_healthy
  
  sandbox-certs:
    container_name: n8n-sandbox-certs
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.1.1
    user: '0:0'
    entrypoint: ['sh', '-c']
    command:
      - >
        bootstrap-mtls.sh --out-dir /tls --api-san sandbox-api
        --control-san-prefix sandbox-runner &&
        chown -R sandbox-api:sandbox-api /tls/api
    environment:
      NUM_RUNNERS: '1'
    volumes:
      - /srv/data/n8n/sandbox-tls:/tls
    networks:
      - homelab-docker

  sandbox-api:
    container_name: n8n-sandbox-api
    image: ghcr.io/n8n-io/n8n-sandbox-service-api:1.1.1
    depends_on:
      sandbox-certs:
        condition: service_completed_successfully
    environment:
      SANDBOX_API_KEYS: ${N8N_SANDBOX_API_KEYS}
      SANDBOX_API_RUNNER_REGISTRATION_TOKEN: ${N8N_SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_API_RUNNER_API_KEY: ${N8N_SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_API_GRPC_TLS_CERT_FILE: /tls/api/grpc-server.crt
      SANDBOX_API_GRPC_TLS_KEY_FILE: /tls/api/grpc-server.key
      SANDBOX_API_GRPC_TLS_CLIENT_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CA_FILE: /tls/api/ca.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/api/control-grpc-api-client.crt
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/api/control-grpc-api-client.key
      SANDBOX_API_RUNNER_CONTROL_GRPC_TLS_SERVER_NAME: sandbox-runner-1
    volumes:
      - /srv/data/n8n/sandbox-tls:/tls:ro
    networks:
      - homelab-docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Never publish 8080/9090 to the host on an internet-facing server.
    # n8n reaches this container by service name over the default Compose network.

  sandbox-runner-1:
    container_name: n8n-sandbox-runner-1
    image: ghcr.io/n8n-io/n8n-sandbox-service-runner-dind:1.1.1
    privileged: true
    depends_on:
      sandbox-api:
        condition: service_healthy
    environment:
      SANDBOX_RUNNER_API_KEYS: ${N8N_SANDBOX_API_RUNNER_API_KEY}
      SANDBOX_RUNNER_REGISTRATION_TOKEN: ${N8N_SANDBOX_API_RUNNER_REGISTRATION_TOKEN}
      SANDBOX_RUNNER_API_GRPC_ADDR: n8n-sandbox-api:9090
      SANDBOX_RUNNER_HTTP_BASE_URL: http://n8n-sandbox-runner-1:8080
      SANDBOX_RUNNER_CONTROL_GRPC_LISTEN_ADDR: ':9091'
      SANDBOX_RUNNER_CONTROL_GRPC_ADVERTISE_ADDR: n8n-sandbox-runner-1:9091
      SANDBOX_RUNNER_ID: runner-1
      SANDBOX_RUNNER_DOCKER_SANDBOX_IMAGE: ghcr.io/n8n-io/n8n-sandbox-service-sandbox:1.1.1
      SANDBOX_RUNNER_REGISTRATION_GRPC_CA_FILE: /tls/runner/ca.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_CERT_FILE: /tls/runner/grpc-client.crt
      SANDBOX_RUNNER_REGISTRATION_GRPC_KEY_FILE: /tls/runner/grpc-client.key
      SANDBOX_RUNNER_REGISTRATION_GRPC_SERVER_NAME: sandbox-api
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CERT_FILE: /tls/runner/control-grpc-server.crt
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_KEY_FILE: /tls/runner/control-grpc-server.key
      SANDBOX_RUNNER_CONTROL_GRPC_TLS_CLIENT_CA_FILE: /tls/runner/ca.crt
    volumes:
      - /srv/data/n8n/sandbox-tls:/tls:ro
    networks:
      - homelab-docker
    # Never expose this container's ports publicly — it runs privileged Docker-in-Docker.

  searxng:
    container_name: n8n-searxng
    image: ghcr.io/searxng/searxng:2026.8.17-374939b88
    environment:
      SEARXNG_SECRET: ${N8N_SEARXNG_SECRET}
    volumes:
      - ./apps/n8n/searxng-settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - homelab-docker
    # Internal-only: n8n reaches it by service name. Never publish its port.

networks:
  homelab-docker:
    name: homelab-docker
    external: true
