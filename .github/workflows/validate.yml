name: validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

jobs:
  compose:
    name: Validate compose
    runs-on: ubuntu-latest
    env:
      CALNODE_ENCRYPTION_KEY: validation-placeholder
      CALNODE_RECOVERY_SECRET: validation-placeholder
      NINEROUTER_JWT_SECRET: validation-placeholder
      NINEROUTER_INITIAL_PASSWORD: validation-placeholder
      NINEROUTER_API_KEY_SECRET: validation-placeholder
      NINEROUTER_MACHINE_ID_SALT: validation-placeholder
      NINEROUTER_SEARXNG_SECRET: validation-placeholder
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: validation-placeholder
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: validation-placeholder
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: validation-placeholder
      HERMES_SEARXNG_SECRET: validation-placeholder
      RYOT_POSTGRES_PASSWORD: validation-placeholder
      RYOT_SERVER_ADMIN_ACCESS_TOKEN: validation-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate compose
        run: ./scripts/deploy.sh config --quiet

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Validate images exist
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/deploy.sh config --images | sort -u | while IFS= read -r image; do
            echo "Checking $image"
            docker manifest inspect "$image" > /dev/null
          done
